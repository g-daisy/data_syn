services:
  sync-service:
    build: .
    env_file:
      - .env
    environment:
      - DWS_PATH=dws
      - DWS_CONFIG_DIR=/app/.dws
      - PROCESSED_IDS_FILE=/app/data/processed_ids.json
    volumes:
      - ./data:/app/data
      - dws_cache:/app/.dws
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "5080:5080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sync-service
    restart: unless-stopped

volumes:
  dws_cache:
